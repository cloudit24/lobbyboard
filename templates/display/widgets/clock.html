{% load static %}
<div class="card clock-card" data-name="clock">
  <svg class="an-clock" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="56" class="an-face"/>
    <g class="an-ticks"><line x1="60" y1="6" x2="60" y2="14" transform="rotate(0 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(30 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(60 60 60)"/><line x1="60" y1="6" x2="60" y2="14" transform="rotate(90 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(120 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(150 60 60)"/><line x1="60" y1="6" x2="60" y2="14" transform="rotate(180 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(210 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(240 60 60)"/><line x1="60" y1="6" x2="60" y2="14" transform="rotate(270 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(300 60 60)"/><line x1="60" y1="9" x2="60" y2="14" transform="rotate(330 60 60)"/></g>
    <line x1="60" y1="60" x2="60" y2="32" class="an-h" id="an-h"/>
    <line x1="60" y1="60" x2="60" y2="18" class="an-m" id="an-m"/>
    <line x1="60" y1="68" x2="60" y2="12" class="an-s" id="an-s"/>
    <circle cx="60" cy="60" r="3.5" class="an-pin"/>
  </svg>
  <div class="ck-text">
    <div class="ck-wd-ar" id="ck-wd-ar"></div>
    <div class="ck-date-ar" id="ck-date-ar"></div>
    <div class="ck-rule"></div>
    <div class="ck-wd-en" id="ck-wd-en"></div>
    <div class="ck-date-en" id="ck-date-en"></div>
  </div>
</div>
