# In front of the app: streams videos and music straight from disk (with
# seeking), and passes everything else to Django.
# Behind a Cloudflare Tunnel the visitor used https: keep what the tunnel says.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Largest upload. Keep in step with MAX_UPLOAD_MB in .env.
    client_max_body_size 2048m;
    client_body_timeout 600s;

    location /media/ {
        alias /data/media/;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
}
