# LobbyBoard - `docker compose up -d`, then open http://<this-computer>:8080/
#   web    the app (Django + Gunicorn), database and uploads live in the `data` volume
#   proxy  nginx: serves uploaded videos/music/photos fast, forwards the rest to `web`
name: lobbyboard

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - data:/data:ro

  # Optional: reach the app from outside through a Cloudflare Tunnel.
  # Put TUNNEL_TOKEN in .env, point the tunnel's public hostname at http://proxy:80,
  # add that hostname in Admin > Network settings, then: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - proxy

volumes:
  data:
